<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EDEDED">
<title>FaceHub</title>
<!-- ★ 图标顺序很重要：浏览器取第一个能用的，把 .ico 放最前 -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07C160">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ═══ 登录 ═══════════════════════════════════════════════ -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <img class="login-logo" src="assets/icon-192.png" alt="FaceHub">
    <h1 class="login-title">FaceHub</h1>
    <p class="login-sub">像微信一样聊天，数据全在你自己的 GitHub 仓库里</p>

    <div id="bridge-box" class="bridge-box" style="display:none">
      <div class="bridge-label" id="bridge-label"></div>
      <div class="bridge-user"><span id="bridge-avatar"></span><b id="bridge-name"></b></div>
      <p class="bridge-note" id="bridge-note"></p>
      <button id="bridge-use" class="btn-bridge">沿用该账号，免输入进入</button>
    </div>

    <input type="password" id="token-input" class="login-input" placeholder="粘贴 GitHub Token（ghp_ 开头）" autocomplete="off">
    <button id="login-btn" class="btn-login">登录</button>
    <a href="https://github.com/settings/tokens/new?description=FaceHub&scopes=repo" target="_blank" rel="noopener" class="login-link">没有 Token？点这里创建 →</a>
    <p class="login-tip">Token 只存在你本机浏览器，不会上传任何服务器</p>
  </div>
</div>

<!-- ═══ 主界面 ═════════════════════════════════════════════ -->
<div id="app" class="app" style="display:none">

  <!-- 左侧导航栏（PC）／底部 Tab（移动） -->
  <nav class="nav-rail">
    <img id="me-avatar" class="nav-avatar" alt="我">
    <button class="nav-btn active" data-tab="chats" title="聊天">
      <span class="nav-ico" data-ico="chat"></span><span class="nav-txt">聊天</span>
      <i id="badge-chat" class="nav-badge" style="display:none"></i>
    </button>
    <button class="nav-btn" data-tab="moments" title="朋友圈">
      <span class="nav-ico" data-ico="moments"></span><span class="nav-txt">朋友圈</span>
    </button>
    <button class="nav-btn" data-tab="discover" title="发现">
      <span class="nav-ico" data-ico="search"></span><span class="nav-txt">发现</span>
    </button>
    <button class="nav-btn" data-tab="apps" title="小程序">
      <span class="nav-ico" data-ico="grid"></span><span class="nav-txt">小程序</span>
    </button>
    <button class="nav-btn" data-tab="contacts" title="通讯录">
      <span class="nav-ico" data-ico="contacts"></span><span class="nav-txt">通讯录</span>
      <i id="badge-invite" class="nav-badge" style="display:none"></i>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-btn" data-tab="me" title="我">
      <span class="nav-ico" data-ico="me"></span><span class="nav-txt">我</span>
    </button>
  </nav>

  <!-- 会话列表 -->
  <aside class="conv-pane" id="conv-pane">
    <header class="pane-head">
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input id="search-input" class="search-input" placeholder="搜索">
      </div>
      <button id="add-btn" class="add-btn" title="发起会话" data-ico="plus"></button>
    </header>
    <div id="invite-banner" class="invite-banner" style="display:none"></div>
    <div id="conv-list" class="conv-list"></div>
  </aside>

  <!-- 聊天区 -->
  <div id="content-col" class="content-col">
  <main class="chat-pane" id="chat-pane">
    <header class="chat-head" id="chat-head" style="display:none">
      <button id="back-btn" class="back-btn" title="返回" data-ico="back"></button>
      <div class="chat-head-txt">
        <div id="chat-title" class="chat-title"></div>
        <div id="chat-sub" class="chat-sub"></div>
      </div>
      <button id="info-btn" class="info-btn" title="详情" data-ico="more"></button>
    </header>

    <div id="messages" class="messages">
      <div class="welcome">
        <img class="welcome-logo" src="assets/icon-192.png" alt="">
        <p>选择一个会话开始聊天</p>
      </div>
    </div>

    <div id="e2e-bar" class="e2e-bar" style="display:none"></div>

    <div class="composer" id="composer" style="display:none">
      <button id="attach-btn" class="attach-btn" title="发送附件（图片/视频/音频/文件）" data-ico="clip"></button>
      <input id="msg-input" class="msg-input" placeholder="发消息…" maxlength="2000" autocomplete="off">
      <button id="send-btn" class="send-btn">发送</button>
    </div>
  </main>

<!-- ═══ 朋友圈（必须在 #app 外面：
      之前嵌在里面，隐藏 #app 会把它一起藏了 → 点开一片空白） ═══ -->
<section id="moments-pane" class="pane-full moments-pane" style="display:none">
    <header class="moments-head">
      <button class="pane-close" data-pane="moments" title="关闭">✕</button>
      <span class="moments-title">朋友圈</span>
      <button id="moments-post" class="btn-primary btn-sm" title="发表">发表</button>
    </header>
    <div class="moments-cover">
      <img id="moments-cover-img" class="moments-cover-img" alt="" style="display:none">
      <div class="moments-cover-fallback">朋友圈</div>
      <button id="moments-camera" class="moments-camera" title="发表">📷</button>
    </div>
    <div id="moments-list" class="moments-list"></div>
    <div id="moments-more" class="moments-more" style="display:none">加载更多</div>
</section>

<!-- ═══ 发现（找人 / 关注） ═══ -->
<section id="discover-pane" class="pane-full discover-pane" style="display:none">
  <header class="moments-head">
    <button class="pane-close" data-pane="discover" title="关闭">✕</button>
    <span class="moments-title">发现</span>
  </header>
  <div class="discover-search">
    <input id="discover-input" class="discover-input" placeholder="搜索 GitHub 用户名…"
           autocomplete="off" maxlength="60">
    <button id="discover-go" class="btn-primary btn-sm">搜索</button>
  </div>
  <div id="discover-list" class="discover-list"></div>
</section>

<!-- ═══ 某人主页 ═══ -->
<section id="profile-pane" class="pane-full profile-pane" style="display:none">
  <header class="moments-head">
    <button class="pane-back" data-pane="profile" title="返回" data-ico="back"></button>
    <span class="moments-title" id="profile-title">主页</span>
  </header>
  <div id="profile-body" class="profile-body"></div>
</section>

<!-- ═══ 小程序 ═══ -->
<section id="apps-pane" class="pane-full apps-pane" style="display:none">
  <header class="moments-head">
    <button class="pane-close" data-pane="apps" title="关闭">✕</button>
    <span class="moments-title">小程序</span>
    <button id="apps-search" class="btn-primary btn-sm" title="搜索">搜索</button>
  </header>
  <div id="apps-list" class="apps-list"></div>
  <div id="apps-player" class="apps-player" style="display:none">
    <div class="apps-player-bar">
      <button id="apps-close" class="apps-close" title="关闭">✕</button>
      <span id="apps-player-name" class="apps-player-name"></span>
      <button id="apps-open" class="apps-open" title="新窗口打开">↗</button>
    </div>
    <iframe id="apps-frame" class="apps-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>
</section>

<!-- ═══ 我（个人页，不用弹窗 —— 那么大的空间浪费了） ═══ -->
<section id="me-pane" class="pane-full me-pane" style="display:none">
  <header class="moments-head">
    <button class="pane-close" data-pane="me" title="关闭">✕</button>
    <span class="moments-title">我</span>
  </header>
  <div class="me-body">
    <div class="me-card">
      <img id="me-avatar" class="me-avatar" alt="">
      <div class="me-id">
        <div id="me-name" class="me-name"></div>
        <div id="me-login" class="me-login"></div>
      </div>
    </div>
    <div id="me-entries" class="me-entries"></div>
  </div>
</section>

</div><!-- /content-col -->
</div><!-- /#app -->

<!-- ═══ 新建会话 ═══════════════════════════════════════════ -->
<div id="new-modal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head"><h3 id="new-modal-title">发起会话</h3><button id="new-modal-x" class="modal-x">×</button></div>
    <div class="modal-body">
      <div class="seg">
        <button class="seg-btn active" data-mode="dm">单聊</button>
        <button class="seg-btn" data-mode="group">群聊</button>
      </div>
      <div id="dm-pane">
        <input id="dm-peer" class="field" placeholder="输入 GitHub 用户名">
        <p class="hint">对方接受邀请后即可开始加密聊天</p>
      </div>
      <div id="group-pane" style="display:none">
        <input id="group-name" class="field" placeholder="群名称（如：周末爬山）">
        <input id="group-members" class="field" placeholder="成员用户名，逗号分隔">
        <p class="hint">成员会收到协作邀请，接受后自动获得群密钥</p>
      </div>
      <div class="modal-actions">
        <button id="new-cancel" class="btn-soft">取消</button>
        <button id="new-ok" class="btn-primary">创建</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ 会话详情 ═══════════════════════════════════════════ -->
<div id="info-modal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head"><h3>会话详情</h3><button id="info-modal-x" class="modal-x">×</button></div>
    <div class="modal-body" id="info-body"></div>
  </div>
</div>

<!-- ═══ 密钥备份 ═══════════════════════════════════════════ -->
<div id="key-modal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head"><h3>🔑 密钥备份</h3><button id="key-modal-x" class="modal-x">×</button></div>
    <div class="modal-body">
      <p class="key-note">私钥只在这台设备。<b>换设备或清缓存，历史消息就解不开了。</b>下面是<b>明文私钥</b>，谁拿到谁能解密，请妥善保存。</p>
      <div class="key-tabs">
        <button class="key-tab active" data-tab="export">导出</button>
        <button class="key-tab" data-tab="import">导入</button>
      </div>
      <div id="key-export-pane">
        <div id="key-count" class="key-count"></div>
        <textarea id="key-backup-text" class="key-text" readonly placeholder="点「生成备份」"></textarea>
        <div class="key-actions">
          <button id="key-gen-btn" class="btn-primary btn-sm">生成备份</button>
          <button id="key-copy-btn" class="btn-soft btn-sm">复制</button>
          <button id="key-download-btn" class="btn-soft btn-sm">下载</button>
        </div>
      </div>
      <div id="key-import-pane" style="display:none">
        <textarea id="key-import-text" class="key-text" placeholder="粘贴备份内容"></textarea>
        <label class="key-check"><input type="checkbox" id="key-overwrite"> 覆盖本机已有密钥</label>
        <div class="key-actions">
          <button id="key-import-btn" class="btn-primary btn-sm">导入</button>
          <label class="btn-soft btn-sm key-file-label">选文件<input type="file" id="key-file" accept=".json,.txt" hidden></label>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script src="js/api.js"></script>
<script src="js/bridge.js"></script>
<script src="js/store.js"></script>
<script src="js/crypto.js"></script>
<script src="js/chat.js"></script>
<script src="js/group.js"></script>
<script src="js/attach.js"></script>
<script src="js/moments.js"></script>
<script src="js/miniapp.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
